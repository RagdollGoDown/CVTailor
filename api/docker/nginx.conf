# nginx serves static files from public/ and passes everything else to Laravel's front controller
# (public/index.php), which PHP-FPM runs. Based on https://laravel.com/docs/deployment#nginx
server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # The API only takes JSON text, never files (docs/Decisions.md D-27).
    client_max_body_size 1m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        # "php" is the compose service name. PHP-FPM listens on port 9000 and speaks FastCGI, not HTTP.
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # No other PHP file is reachable from outside, and neither are dotfiles such as .env.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
